openapi: 3.0.3
info:
  title: 'Smart Waste Management API'
  description: 'REST API untuk aplikasi web (admin & user) dan mobile Smart Waste Management.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8088'
tags:
  -
    name: AI
    description: ''
  -
    name: Auth
    description: ''
  -
    name: Dashboard
    description: ''
  -
    name: Reports
    description: "\nUser hanya melihat dan mengelola laporan miliknya. Admin melihat semua laporan."
  -
    name: 'Users (admin)'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Dapatkan token dari endpoint <b>POST /api/v1/auth/login</b> atau <b>/auth/register</b>, lalu kirim sebagai header <code>Authorization: Bearer {TOKEN}</code>.'
security:
  -
    default: []
paths:
  /api/v1/predict:
    post:
      summary: 'Prediksi kategori sampah'
      operationId: prediksiKategoriSampah
      description: "Proxy ke layanan ML. Dipakai untuk preview sebelum laporan dikirim.\nBila `uncertain = true`, client sebaiknya meminta user memilih kategori.\nBila `recognized = false` (model menjawab `other`, mis. foto gitar), `label` bernilai null: foto tidak dikenali sebagai sampah organik, kertas, atau plastik."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    label: plastic
                    confidence: 0.94
                    uncertain: false
                    recognized: true
                    probabilities:
                      organic: 0.02
                      other: 0.01
                      paper: 0.03
                      plastic: 0.94
                properties:
                  data:
                    type: object
                    properties:
                      label:
                        type: string
                        nullable: true
                        example: plastic
                        description: 'organic | paper | plastic, atau null bila foto tidak dikenali sebagai sampah.'
                      confidence:
                        type: number
                        example: 0.94
                      uncertain:
                        type: boolean
                        example: false
                      recognized:
                        type: boolean
                        example: true
                        description: 'false bila model menjawab other (bukan sampah organik/kertas/plastik).'
                      probabilities:
                        type: object
                        properties:
                          organic:
                            type: number
                            example: 0.02
                          other:
                            type: number
                            example: 0.01
                          paper:
                            type: number
                            example: 0.03
                          plastic:
                            type: number
                            example: 0.94
        503:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Layanan AI sedang tidak tersedia.'
                properties:
                  message:
                    type: string
                    example: 'Layanan AI sedang tidak tersedia.'
      tags:
        - AI
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Foto sampah yang akan diklasifikasi. Must be an image. Must not be greater than 10240 kilobytes.'
              required:
                - file
  /api/v1/auth/register:
    post:
      summary: Register
      operationId: register
      description: 'Membuat akun baru (selalu role `user`) dan langsung mengembalikan token.'
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The password field confirmation does not match.'
                  errors:
                    password:
                      - 'The password field confirmation does not match.'
                properties:
                  message:
                    type: string
                    example: 'The password field confirmation does not match.'
                  errors:
                    type: object
                    properties:
                      password:
                        type: array
                        example:
                          - 'The password field confirmation does not match.'
                        items:
                          type: string
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: 'Budi Santoso'
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 150 characters.'
                  example: budi@example.com
                phone:
                  type: string
                  description: 'Must not be greater than 30 characters.'
                  example: '081234567890'
                  nullable: true
                password:
                  type: string
                  description: ''
                  example: password123
                device_name:
                  type: string
                  description: 'Nama token (opsional). Must not be greater than 100 characters.'
                  example: 'Pixel 7'
                  nullable: true
              required:
                - name
                - email
                - password
      security: []
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      description: "Mengembalikan token Sanctum. Kirim `client=mobile` dari aplikasi mobile:\nakun admin akan ditolak dengan 403."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    token: 4|ECn8vgYnIcfna27mm0jcm3OBfSUDBieUYAMLOPjBab4d613f
                    token_type: Bearer
                    user:
                      id: 2
                      name: 'Budi Santoso'
                      email: user@swm.test
                      role: user
                      phone: '085198118418'
                      avatar_url: null
                      is_active: true
                      created_at: '2026-11-04T16:10:42+00:00'
                  message: 'Login berhasil.'
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 4|ECn8vgYnIcfna27mm0jcm3OBfSUDBieUYAMLOPjBab4d613f
                      token_type:
                        type: string
                        example: Bearer
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 2
                          name:
                            type: string
                            example: 'Budi Santoso'
                          email:
                            type: string
                            example: user@swm.test
                          role:
                            type: string
                            example: user
                          phone:
                            type: string
                            example: '085198118418'
                          avatar_url:
                            type: string
                            example: null
                            nullable: true
                          is_active:
                            type: boolean
                            example: true
                          created_at:
                            type: string
                            example: '2026-11-04T16:10:42+00:00'
                  message:
                    type: string
                    example: 'Login berhasil.'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: user@swm.test
                password:
                  type: string
                  description: ''
                  example: password
                client:
                  type: string
                  description: '`web` atau `mobile`. Admin ditolak (403) bila `mobile`.'
                  example: web
                  enum:
                    - web
                    - mobile
                  nullable: true
                device_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: Chrome
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Mencabut token yang sedang dipakai.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Auth
  /api/v1/auth/me:
    get:
      summary: 'Profil saya'
      operationId: profilSaya
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Auth
  /api/v1/auth/profile:
    put:
      summary: 'Update profil'
      operationId: updateProfil
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Auth
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: 'Budi Santoso'
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 150 characters.'
                  example: budi@example.com
                phone:
                  type: string
                  description: 'Must not be greater than 30 characters.'
                  example: '081234567890'
                  nullable: true
                avatar:
                  type: string
                  format: binary
                  description: 'Foto profil (opsional, multipart). Must be an image. Must not be greater than 5120 kilobytes.'
                  nullable: true
  /api/v1/auth/password:
    put:
      summary: 'Ganti password'
      operationId: gantiPassword
      description: 'Token lain milik user dicabut, token yang sedang dipakai tetap aktif.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  description: ''
                  example: password
                password:
                  type: string
                  description: 'The value and <code>current_password</code> must be different.'
                  example: newpassword123
              required:
                - current_password
                - password
  /api/v1/dashboard/stats:
    get:
      summary: Statistik
      operationId: statistik
      description: 'Admin mendapat statistik semua laporan, user mendapat statistik miliknya.'
      parameters:
        -
          in: query
          name: days
          description: 'Rentang tren: 7 atau 30.'
          example: 30
          required: false
          schema:
            type: integer
            description: 'Rentang tren: 7 atau 30.'
            example: 30
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Dashboard
  '/api/v1/reports/{report_id}/status':
    patch:
      summary: 'Update status (admin)'
      operationId: updateStatusadmin
      description: 'Setiap perubahan dicatat di riwayat status.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: ''
                  example: in_progress
                  enum:
                    - pending
                    - in_progress
                    - completed
                    - rejected
                note:
                  type: string
                  description: 'Wajib bila status `rejected`. Must not be greater than 1000 characters.'
                  example: 'Petugas menuju lokasi.'
                  nullable: true
              required:
                - status
    parameters:
      -
        in: path
        name: report_id
        description: 'The ID of the report.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/reports:
    get:
      summary: 'Daftar laporan'
      operationId: daftarLaporan
      description: ''
      parameters:
        -
          in: query
          name: search
          description: 'Cari di judul, deskripsi, alamat. Must not be greater than 100 characters.'
          example: plastik
          required: false
          schema:
            type: string
            description: 'Cari di judul, deskripsi, alamat. Must not be greater than 100 characters.'
            example: plastik
            nullable: true
        -
          in: query
          name: status
          description: ''
          example: pending
          required: false
          schema:
            type: string
            description: ''
            example: pending
            enum:
              - pending
              - in_progress
              - completed
              - rejected
            nullable: true
        -
          in: query
          name: category
          description: ''
          example: plastic
          required: false
          schema:
            type: string
            description: ''
            example: plastic
            enum:
              - organic
              - plastic
              - paper
            nullable: true
        -
          in: query
          name: user_id
          description: 'Khusus admin: filter per pelapor.'
          example: null
          required: false
          schema:
            type: integer
            description: 'Khusus admin: filter per pelapor.'
            example: null
            nullable: true
        -
          in: query
          name: date_from
          description: 'Must be a valid date.'
          example: '2026-11-01'
          required: false
          schema:
            type: string
            description: 'Must be a valid date.'
            example: '2026-11-01'
            nullable: true
        -
          in: query
          name: date_to
          description: 'Must be a valid date. Must be a date after or equal to <code>date_from</code>.'
          example: '2026-11-30'
          required: false
          schema:
            type: string
            description: 'Must be a valid date. Must be a date after or equal to <code>date_from</code>.'
            example: '2026-11-30'
            nullable: true
        -
          in: query
          name: sort
          description: 'Kolom: created_at, updated_at, title, status, category. Awalan `-` untuk descending. Must not be greater than 30 characters.'
          example: '-created_at'
          required: false
          schema:
            type: string
            description: 'Kolom: created_at, updated_at, title, status, category. Awalan `-` untuk descending. Must not be greater than 30 characters.'
            example: '-created_at'
            nullable: true
        -
          in: query
          name: page
          description: 'Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Must be at least 1.'
            example: 1
            nullable: true
        -
          in: query
          name: per_page
          description: 'Must be at least 1. Must not be greater than 100.'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Must be at least 1. Must not be greater than 100.'
            example: 10
            nullable: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
