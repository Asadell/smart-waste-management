    post:
      summary: 'Buat laporan'
      operationId: buatLaporan
      description: "Kalau `ai_label` kosong, backend memanggil layanan ML sendiri. Kalau ML\nsedang mati, laporan tetap tersimpan dengan `ai_label = null`."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Reports
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                  description: 'Foto sampah (jpg/png/webp, maks 10MB). Must be an image. Must not be greater than 10240 kilobytes.'
                title:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: 'Sampah plastik menumpuk di trotoar'
                description:
                  type: string
                  description: 'Must not be greater than 2000 characters.'
                  example: 'Sudah 3 hari tidak diangkut.'
                  nullable: true
                latitude:
                  type: number
                  description: 'Must be between -90 and 90.'
                  example: -7.2756
                longitude:
                  type: number
                  description: 'Must be between -180 and 180.'
                  example: 112.7426
                address:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'Jl. Raya ITS, Sukolilo, Surabaya'
                  nullable: true
                category:
                  type: string
                  description: 'Kategori final (hasil prefill AI, boleh diubah user).'
                  example: plastic
                  enum:
                    - organic
                    - plastic
                    - paper
                ai_label:
                  type: string
                  description: 'Tebakan AI dari /predict. Bila kosong backend memanggil ML sendiri.'
                  example: plastic
                  enum:
                    - organic
                    - plastic
                    - paper
                  nullable: true
                ai_confidence:
                  type: number
                  description: 'Must be between 0 and 1.'
                  example: 0.94
                  nullable: true
                ai_uncertain:
                  type: boolean
